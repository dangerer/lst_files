<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<!--
	=====================
		Partials/List/Item.html
-->
<div class="article article-schulungen articletype-{newsItem.type}{f:if(condition: newsItem.istopnews, then: ' topnews')}" itemscope="itemscope" itemtype="http://schema.org/Article">
	<n:excludeDisplayedNews newsItem="{newsItem}"/>


	<f:if condition="{newsItem.mediaPreviews}">
		<!-- media preview element -->
		<f:then>
			<div class="news-img-wrap">
				<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
					<f:alias map="{mediaElement: '{newsItem.mediaPreviews.0}'}">
						<f:if condition="{mediaElement.originalResource.type} == 2">
							<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="{f:if(condition: settings.media.Width, then: settings.media.Width, else: settings.list.media.image.Width)}" height="{f:if(condition: settings.media.Height, then: settings.media.Height, else: settings.list.media.image.Height)}"/>
						</f:if>
						<f:if condition="{mediaElement.originalResource.type} == 4">
							<f:render partial="Detail/MediaVideo" arguments="{mediaElement: mediaElement}"/>
						</f:if>
						<f:if condition="{mediaElement.originalResource.type} == 5">
							<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="{f:if(condition: settings.media.Width, then: settings.media.Width, else: settings.list.media.image.Width)}" height="{f:if(condition: settings.media.Height, then: settings.media.Height, else: settings.list.media.image.Height)}"/>
						</f:if>
					</f:alias>
				</n:link>
			</div>
		</f:then>
		<f:else>
			<f:if condition="{settings.displayDummyIfNoMedia}">
				<div class="news-img-wrap">
					<span class="no-media-element">
						<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
							<f:image src="{settings.list.media.dummyImage}" title="" alt="" width="{f:if(condition: settings.media.Width, then: settings.media.Width, else: settings.list.media.image.Width)}" height="{f:if(condition: settings.media.Height, then: settings.media.Height, else: settings.list.media.image.Height)}"/>
						</n:link>
					</span>
				</div>
			</f:if>
		</f:else>
	</f:if>

	<!-- header -->
	
	<div class="NO-news-list-divider-month news-list-date">
		<!-- Schulungen ganzjährig -->		
		{f:translate(key: 'news.trainingyearround', extensionName: 'gtn_lsthooks')}
	</div>	

	<f:if condition="{newsItem.lstFullybooked}">
		<f:then>
			<!-- span class="badge badge-danger">{f:translate(key: 'news.fullyBooked', extensionName: 'gtn_lsthooks')}</span -->		
		</f:then>
	</f:if>
	
	<div class="header">
		<h2>
			<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
				<span itemprop="headline">{newsItem.title}</span>
			
			<f:if condition="{newsItem.lstFullybooked}">
				<f:then>
					<span class="badge badge-danger">Ausgebucht</span>
				</f:then>
				<f:else>
				 	
				</f:else>
			</f:if>
			</n:link>
		</h2>
	</div>
	
	
	
	<!-- teaser -->
	<div class="teaser-text">
		<n:removeMediaTags>
		<!-- f:if condition="{newsItem.teaser}">
			<f:then>
				<div itemprop="description">{newsItem.teaser -> f:format.crop(maxCharacters: '{settings.cropMaxCharacters}', respectWordBoundaries:'1') -> f:format.html()}</div>
			</f:then>
			<f:else>
				<div itemprop="description">{newsItem.bodytext -> f:format.crop(maxCharacters: '{settings.cropMaxCharacters}', respectWordBoundaries:'1') -> f:format.html()}</div>
			</f:else>
		</f:if -->
		</n:removeMediaTags>
		
		
		<n:link newsItem="{newsItem}" settings="{settings}" class="btn btn-primary btn-lst btn-sm" title="{newsItem.title}">
			<f:translate key="more-link"/>
		</n:link>
		
	</div>

	<!-- footer information -->
	<!-- div class="footer">
		<p>
			
			<span class="news-list-date">
				<time datetime="{f:format.date(date:newsItem.datetime, format:'Y-m-d')}">
					<f:format.date format="{f:translate(key:'dateFormat')}">{newsItem.datetime}</f:format.date>
					<meta itemprop="datePublished" content="{f:format.date(date:newsItem.datetime, format:'Y-m-d')}" />
				</time>
			</span>

			<f:if condition="{newsItem.firstCategory}">
				
				<span class="news-list-category">{newsItem.firstCategory.title}</span>
			</f:if>

			<f:if condition="{newsItem.tags}">
			
				<span class="news-list-tags" itemprop="keywords">
					<f:for each="{newsItem.tags}" as="tag">
						{tag.title}
					</f:for>
				</span>
			</f:if>

		
			<f:if condition="{newsItem.author}">
				<span class="news-list-author">
					<f:translate key="author" arguments="{0:newsItem.author}"/>
				</span>
			</f:if>
		</p>
	</div -->
</div>
</html>
