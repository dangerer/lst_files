<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:spaceless>

<f:if condition="{data.layout} == 1">

	<f:then>
	
		
				<f:if condition="{data._LOCALIZED_UID}">
					<a id="c{data._LOCALIZED_UID}"></a>
				</f:if>
				<f:render section="Before" optional="true">
					<f:render partial="DropIn/Before/All" arguments="{_all}" />
				</f:render>
				<f:render section="Header" optional="true">
					<f:render partial="Header/All" arguments="{_all}" />
				</f:render>
				<f:render section="Main" optional="true" />
				<f:render section="Footer" optional="true">
					<f:render partial="Footer/All" arguments="{_all}" />
				</f:render>
				<f:render section="After" optional="true">
					<f:render partial="DropIn/After/All" arguments="{_all}" />
				</f:render>
	
	
	</f:then>
	
	<f:else>
	
		<f:if condition="{data.layout} == 10">
		
			<f:then>
			
			
			
				<f:if condition="{data._LOCALIZED_UID}">
					<a id="c{data._LOCALIZED_UID}"></a>
				</f:if>
				<f:render section="Before" optional="true">
					<f:render partial="DropIn/Before/All" arguments="{_all}" />
				</f:render>
				<f:render section="Header" optional="true">
					<f:render partial="Header/All" arguments="{_all}" />
				</f:render>
				<f:render section="Main" optional="true" />
				<f:render section="Footer" optional="true">
					<f:render partial="Footer/All" arguments="{_all}" />
				</f:render>
				<f:render section="After" optional="true">
					<f:render partial="DropIn/After/All" arguments="{_all}" />
				</f:render>
			
			
			
			</f:then>
			
			<f:else>
			
			
				<div class="csc-default">
					<f:if condition="{data._LOCALIZED_UID}">
						<a id="c{data._LOCALIZED_UID}"></a>
					</f:if>
					<f:render section="Before" optional="true">
						<f:render partial="DropIn/Before/All" arguments="{_all}" />
					</f:render>
					<f:render section="Header" optional="true">
						<f:render partial="Header/All" arguments="{_all}" />
					</f:render>
					<f:render section="Main" optional="true" />
					<f:render section="Footer" optional="true">
						<f:render partial="Footer/All" arguments="{_all}" />
					</f:render>
					<f:render section="After" optional="true">
						<f:render partial="DropIn/After/All" arguments="{_all}" />
					</f:render>
				</div>
				<table class="spacer" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;">
                  <tbody>
                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                        <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #000000; font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 30px; font-weight: normal; hyphens: auto; line-height: 30px; margin: 0; mso-line-height-rule: exactly; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;border-bottom: 1px solid #dfdfe0;" height="30">&nbsp;</td>
                    </tr>
                    
                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                        <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #000000; font-family: Verdana, Arial, Helvetica, sans-serif; font-size: 32px; font-weight: normal; hyphens: auto; line-height: 32px; margin: 0; mso-line-height-rule: exactly; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;" height="30">&nbsp;</td>
                    </tr>
                  </tbody>
                </table>
			
			</f:else>
		
		</f:if>	
	
	</f:else>
	
</f:if>




</f:spaceless>
</html>
