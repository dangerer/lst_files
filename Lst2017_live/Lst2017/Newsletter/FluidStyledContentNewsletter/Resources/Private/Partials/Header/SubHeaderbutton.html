<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{subheader}">
	<f:switch expression="{layout}">
		<f:case value="1">
			<h2 class="{positionClass}">
				{subheader}
			</h2>
		</f:case>
		<f:case value="2">
			<br />
			<table width="100%" border="0" cellspacing="0" cellpadding="0" style="margin: 0; padding: 0; border-collapse: collapse; border-spacing: 0;">
			  <tr style="padding: 0; text-align: left; vertical-align: top;">
			    <td style="margin: 0; padding: 0 0;">
			      <table border="0" cellspacing="0" cellpadding="0" style="margin: 0; padding: 0; border-collapse: collapse; border-spacing: 0;">
			        <tr style="padding: 0; text-align: left; vertical-align: top;">
			          <td bgcolor="#da251d" style="padding: 8px 20px 6px 20px; border-radius:0; display: inline-block; margin-left: auto; margin-right: auto;font-weight: normal;" align="center">
				          <f:link.typolink additionalAttributes="{style: 'font-size: 15px;font-family: Helvetica, Arial, sans-serif;font-weight: normal;color: #ffffff !important;text-decoration: none;display: inline-block;margin-left: auto;margin-right: auto;'}" parameter="{headerlink}" target="_blank" class="newsletterbutton">
				        
					         {subheader}
					
					      </f:link.typolink>
					   </td>
			        </tr>
			      </table>
			    </td>
			  </tr>
			</table>
			
		</f:case>
		<f:case value="3">
			<h4 class="{positionClass}">
				{subheader}
			</h4>
		</f:case>
		<f:case value="4">
			<h5 class="{positionClass}">
				{subheader}
			</h5>
		</f:case>
		<f:case value="5">
			<h6 class="{positionClass}">
				{subheader}
			</h6>
		</f:case>
		<f:defaultCase>
			<f:if condition="{default}">
				<f:render partial="Header/SubHeaderbutton" arguments="{
					subheader: subheader,
					headerlink: headerlink,
					positionClass: positionClass,
					layout: default}" />
			</f:if>
		</f:defaultCase>
	</f:switch>
</f:if>
</html>
