<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<h3>
    <f:translate key="change_password"/>
</h3>
<p>
    <f:if condition="{passwordRequirements}">
        <f:then>
            <f:translate key="change_password_description" />
        </f:then>
        <f:else>
            <f:translate key="change_password_message" arguments="{0: settings.newPasswordMinLength}"/>
        </f:else>
    </f:if>
</p>

<f:render partial="ValidationErrors"/>

<f:form action="changePassword" method="post" additionalAttributes="{spellcheck: 'false'}">
    <legend class="sr-only">
        <f:translate key="change_password"/>
    </legend>
    <div>
        <div class="form-group">
            <label for="tx-felogin-input-newpassword-1">
                <f:translate key="newpassword_label1"/>
            </label>
            <f:form.password name="newPass" class="form-control" autocomplete="new-password" id="tx-felogin-input-newpassword-1"/>
        <div class="form-group">
    </div>
    <div>
        <div class="form-group">
            <label for="tx-felogin-input-newpassword-2">
                <f:translate key="newpassword_label2"/>
            </label>
            <f:form.password name="newPassRepeat" class="form-control" autocomplete="new-password" id="tx-felogin-input-newpassword-2"/>
        </div>
    </div>
    <f:form.hidden name="hash" value="{hash}"/>
    <f:form.submit class="btn btn-primary btn-lst btn-arrow" value="{f:translate(key: 'change_password')}"/>
</f:form>
<div class="mt-4">
    <f:if condition="{passwordRequirements}">
        <p><f:translate key="password_requirement"/></p>
        <ul>
            <f:for each="{passwordRequirements}" as="passwordRequirement">
                <li>{passwordRequirement}</li>
            </f:for>
        </ul>
    </f:if>
</div>
<p>
    <f:link.action action="login" controller="Login">
        <f:translate key="forgot_header_backToLogin"/>
    </f:link.action>
</p>
</html>
