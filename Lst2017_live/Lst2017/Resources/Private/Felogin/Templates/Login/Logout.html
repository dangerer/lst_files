<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">

<h3>
    <f:render partial="RenderLabelOrMessage" arguments="{key: 'status_header'}"/>
</h3>
<div class="alert alert-primary" role="alert" bis_skin_checked="1">
    <div bis_skin_checked="1"><f:render partial="RenderLabelOrMessage" arguments="{key: 'status_message'}"/></div>
</div>


<f:form action="login" actionUri="{actionUri}" target="_top" fieldNamePrefix="">
    <fieldset>
        <legend>
            <f:translate key="logout"/>
        </legend>
        <div class="form-group" bis_skin_checked="1">
            <label for="tx-felogin-input-logout">
                <f:translate key="username"/>
            </label>
            {user.username}
        </div>
        <div>
            <f:form.submit value="{f:translate(key: 'logout')}" class="btn btn-primary btn-lst btn-arrow" name="submit" id="tx-felogin-input-logout"/>
        </div>

        <div class="felogin-hidden">
            <f:form.hidden name="logintype" value="logout"/>
        </div>
    </fieldset>
</f:form>
</html>
