<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{sectionUid}">
    <f:then>
        <f:form.textfield name="answer[{questionUid}][{sectionUid}]" value="{answer.uid}" />
    </f:then>
    <f:else>
        <div class="answer-question-{questionUid}">
            <f:form.textfield name="answer[{questionUid}]" value="{answer.uid}" />
        </div>
    </f:else>
</f:if>
</html>
