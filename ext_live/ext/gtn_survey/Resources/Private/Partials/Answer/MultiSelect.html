<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:if condition="{sectionUid}">
    <f:then>
        <f:form.checkbox name="answer[{questionUid}][{sectionUid}]" multiple="1" value="{answer.uid}" /> <span class="answer-text">{answer.text}</span>
    </f:then>
    <f:else>
        <div class="answer-question-{questionUid}">
             <f:form.checkbox name="answer[{questionUid}]" multiple="1"  value="{answer.uid}" /> <span class="answer-text">{answer.text}</span>
        </div>
    </f:else>
</f:if>
</html>
