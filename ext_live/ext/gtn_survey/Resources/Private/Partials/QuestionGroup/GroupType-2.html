
<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<div class="group-type-2">
    <div class="row"> 
        <div class="col-xl-10">

        </div>
        <div class="col-xl-2 smiley-container">
                <div class="smiley-char-container">

                           <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/sad.png" absolute="1" />
                </span>
                    <span class="empty-space"> </span>
                    <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/neutral.png" absolute="1" />
                </span>
                    <span class="empty-space"> </span>
                    <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/happy.png" absolute="1"/>
                </span>
                </div>


        </div>
    </div>
        <f:for each="{questionGroup.questions}" as="question">
        <f:render partial="Question/QuestionType" arguments="{question:question,questionGroup:questionGroup}"/>
    </f:for>
</div>
</html>
