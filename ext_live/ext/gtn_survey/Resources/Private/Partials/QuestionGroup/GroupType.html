<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:switch expression="{questionGroup.groupType.type}">
    <f:case value="1">
        <f:render partial="QuestionGroup/GroupType-Default" arguments="{questionGroup:questionGroup}"/>
    </f:case>
    <f:case value="2">
        <div class="group-type-3">
            <div class="row">
                <div class="col-xl-8">
                </div>
                <div class="section-container col-xl-4">
                    <f:for each="{questionGroup.sections}" as="section">
                        <div class="section-title-container">
                            <span>{section.title}</span>
                        </div>
                    </f:for>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-8">

                </div>
                <div class="col-xl-4 smiley-container">
                    <f:for each="{questionGroup.sections}" as="section">
                        <div class="smiley-char-container">

                           <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/sad.png"
                                                              absolute="1"/>
                </span>
                            <span class="empty-space"> </span>
                            <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/neutral.png"
                                                               absolute="1"/>
                </span>
                            <span class="empty-space"> </span>
                            <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/happy.png"
                                                               absolute="1"/>
                </span>
                        </div>

                    </f:for>

                </div>

            </div>
            <f:for each="{questionGroup.questions}" as="question">
                <f:render partial="Question/QuestionType"
                          arguments="{question:question, sections:questionGroup.sections}"/>
            </f:for>
        </div>
    </f:case>
    <f:case value="3">
        <div class="group-type-2">
            <div class="row">
                <div class="col-xl-10">

                </div>
                <div class="col-xl-2 smiley-container">
                    <div class="smiley-char-container">

                           <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/sad.png"
                                                              absolute="1"/>
                </span>
                        <span class="empty-space"> </span>
                        <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/neutral.png"
                                                           absolute="1"/>
                </span>
                        <span class="empty-space"> </span>
                        <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/happy.png"
                                                           absolute="1"/>
                </span>
                    </div>


                </div>
            </div>
            <f:for each="{questionGroup.questions}" as="question">
                <f:render partial="Question/QuestionType" arguments="{question:question,questionGroup:questionGroup}"/>
            </f:for>
        </div>
    </f:case>
    <f:case value="4">
        <div class="group-type-3">
            <div class="row">
                <div class="col-xl-8">
                </div>
                <div class="section-container col-xl-4">
                    <f:for each="{questionGroup.sections}" as="section">
                        <div class="section-title-container">
                            <span>{section.title}</span>
                        </div>
                    </f:for>
                </div>
            </div>
            <div class="row">
                <div class="col-xl-8">

                </div>
                <div class="col-xl-4 smiley-container">
                    <f:for each="{questionGroup.sections}" as="section">
                        <div class="smiley-char-container">

                           <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/sad.png"
                                                              absolute="1"/>
                </span>
                            <span class="empty-space"> </span>
                            <span class="empty-space"> </span>
                            <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/happy.png"
                                                               absolute="1"/>
                </span>
                        </div>

                    </f:for>

                </div>

            </div>
            <f:for each="{questionGroup.questions}" as="question">
                <f:render partial="Question/QuestionType"
                          arguments="{question:question, sections:questionGroup.sections}"/>
            </f:for>
        </div>
    </f:case>
    <f:case value="5">
        <div class="group-type-2">
            <div class="row">
                <div class="col-xl-10">

                </div>
                <div class="col-xl-2 smiley-container">
                    <div class="smiley-char-container">

                           <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/sad.png"
                                                              absolute="1"/>
                </span>
                        <span class="empty-space"> </span>
                        <span class="empty-space"> </span>
                        <span class="smiley-char"><f:image src="EXT:gtn_survey/Resources/Public/Icons/happy.png"
                                                           absolute="1"/>
                </span>
                    </div>


                </div>
            </div>
            <f:for each="{questionGroup.questions}" as="question">
                <f:render partial="Question/QuestionType" arguments="{question:question,questionGroup:questionGroup}"/>
            </f:for>
        </div>
    </f:case>
    <f:defaultCase>

    </f:defaultCase>
</f:switch>
</html>
