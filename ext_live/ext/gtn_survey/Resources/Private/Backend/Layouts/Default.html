<html xmlns:f="https://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:comment><f:be.pageRenderer includeRequireJsModules="{
   0:'../typo3conf/ext/gtn_survey/Resources/Public/JavaScript/GraphModule.js'
}" /></f:comment>
<f:be.pageRenderer includeRequireJsModules="{
   10:'TYPO3/CMS/GtnSurvey/Graph'
}" />
	<f:be.container>
		<div class="typo3-fullDoc">
			<div id="typo3-docheader">
				<div class="typo3-docheader-functions">
					<div class="left">
						<f:be.buttons.csh />
						<f:be.menus.actionMenu>
							<f:be.menus.actionMenuItem label="Overview" controller="" action="list" />
							<f:be.menus.actionMenuItem label="Create new Answer" action="new" controller="Answer" />
									<f:be.menus.actionMenuItem label="Create new Question" action="new" controller="Question" />
									<f:be.menus.actionMenuItem label="Create new Survey" action="new" controller="Survey" />
									<f:be.menus.actionMenuItem label="Create new UserAnswer" action="new" controller="UserAnswer" />
						</f:be.menus.actionMenu>
					</div>
					<div class="right">
						<f:be.pagePath />
						<f:be.pageInfo />
					</div>
				</div>
				<div class="typo3-docheader-buttons">
					<div class="left">

					</div>
					<div class="right">
						<f:be.buttons.shortcut />
					</div>
				</div>

			</div>
			<div id="typo3-docbody">
				<div id="typo3-inner-docbody">
					<f:flashMessages />
					<f:render section="HeaderAssets"/>

					<f:render section="content" />
					<f:render section="FooterAssets"/>

				</div>
			</div>

		</div>
	</f:be.container>

</html>
